services:
  - type: web
    name: ivy-homes-mumbai
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: IVY_API_KEY
        sync: false
      - key: IVY_API_BASE_URL
        value: https://solve.ivy.homes
